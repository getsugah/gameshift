name: Publish GameShift alpha.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-alpha2.yml]

permissions: {}

concurrency:
  group: publish-gameshift-alpha2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed distribution files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify artifact checksums
        working-directory: releases/0.5.0-alpha.2
        run: |
          sha256sum -c GameShift-0.5.0-alpha.2-x86_64.AppImage.sha256
          sha256sum -c GameShift-0.5.0-alpha.2-sources.tar.gz.sha256
      - name: Publish the prerelease with its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.5.0-alpha.2
          directory=releases/0.5.0-alpha.2
          if existing_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$existing_draft" = false ]; then
              echo 'The release is already published; existing assets are preserved.'
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --prerelease \
              --title 'GameShift 0.5.0-alpha.2' --notes-file .github/release-alpha2.md
          fi
          gh release upload "$tag" \
            "$directory/GameShift-0.5.0-alpha.2-x86_64.AppImage" \
            "$directory/GameShift-0.5.0-alpha.2-x86_64.AppImage.sha256" \
            "$directory/GameShift-0.5.0-alpha.2-sources.tar.gz" \
            "$directory/GameShift-0.5.0-alpha.2-sources.tar.gz.sha256" \
            "$directory/NATIVE-COMPONENTS.json" \
            "$directory/VALIDATION.json" --clobber
          gh release edit "$tag" --draft=false --prerelease
