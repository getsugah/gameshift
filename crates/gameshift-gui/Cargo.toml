[package]
name = "gameshift-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gameshift-profiles = { path = "../gameshift-profiles" }
gameshift-control = { path = "../gameshift-control" }
gameshift-cpu.workspace = true
gameshift-telemetry.workspace = true
gameshift-bench.workspace = true
gameshift-core.workspace = true
gameshift-hardware.workspace = true
gameshift-system-bench = { path = "../gameshift-system-bench" }
libc = "0.2"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
